[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome-winctl"
version = "0.1.0"
description = "Exact GNOME Wayland window placement over D-Bus"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
gnome-winctl = "gnome_winctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

